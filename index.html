<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ihirwe.art</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    iframe {
      border: none;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      display: block;
      position: relative;
      pointer-events: auto;
    }
    
    /* Ensure proper mobile viewport handling */
    @media screen and (max-width: 768px) {
      iframe {
        height: 100vh;
        height: -webkit-fill-available; /* iOS Safari fix */
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      
      body {
        height: 100vh;
        height: -webkit-fill-available;
      }
    }
    
    /* Fix for very small screens */
    @media screen and (max-width: 480px) {
      iframe {
        width: 100%;
        height: 100vh;
        height: -webkit-fill-available;
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
    }
    
    /* Responsive logo overlay */
    #logo-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 200px;
      height: 50px;
      background: #080808;
      z-index: 1000;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(8, 8, 8, 0.8), 0 0 40px rgba(8, 8, 8, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    @media screen and (max-width: 768px) {
      #logo-overlay {
        width: 160px;
        height: 45px;
        bottom: 15px;
        right: 15px;
        padding: 6px 10px;
      }
    }
    
    @media screen and (max-width: 480px) {
      #logo-overlay {
        width: 140px;
        height: 40px;
        bottom: 10px;
        right: 10px;
        padding: 5px 8px;
        border-radius: 8px;
      }
    }
    
    #logo-image {
      height: 100%;
      max-height: 40px;
      width: auto;
      object-fit: contain;
      filter: brightness(1.1);
      transition: all 0.3s ease;
    }
    
    @media screen and (max-width: 768px) {
      #logo-image {
        max-height: 35px;
      }
    }
    
    @media screen and (max-width: 480px) {
      #logo-image {
        max-height: 30px;
      }
    }
  </style>
</head>
<body>
  <div style="position: relative; width: 100%; height: 100%;">
    <iframe src="https://ihirweui.framer.website" allow="autoplay; fullscreen; microphone; camera" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    <!-- Overlay to hide the Framer button -->
    <div id="logo-overlay">
      <img src="assets/me.png" alt="ihirwe" id="logo-image">
    </div>
  </div>
  
  <script>
    // Ensure iframe can receive all interactions
    document.addEventListener('DOMContentLoaded', function() {
      const iframe = document.querySelector('iframe');
      
      // Make sure iframe is focusable and can receive events
      iframe.setAttribute('tabindex', '0');
      iframe.style.pointerEvents = 'auto';
      
      // Ensure the iframe container doesn't block events
      const container = iframe.parentElement;
      container.style.pointerEvents = 'none';
      iframe.style.pointerEvents = 'auto';
      
      // Add touch event support for mobile
      iframe.addEventListener('touchstart', function(e) {
        // Allow touch events to pass through
        e.stopPropagation();
      }, { passive: true });
      
      iframe.addEventListener('touchend', function(e) {
        // Allow touch events to pass through
        e.stopPropagation();
      }, { passive: true });
      
      // Force focus on iframe to ensure it can receive events
      iframe.focus();
      
      // Add click event listener to ensure clicks work
      iframe.addEventListener('click', function(e) {
        // Ensure the iframe receives the click
        iframe.focus();
      });
      
      // Handle window resize to ensure iframe stays interactive
      window.addEventListener('resize', function() {
        iframe.focus();
      });
    });
    
    // Logo overlay functionality
    document.addEventListener('DOMContentLoaded', function() {
      const logoOverlay = document.getElementById('logo-overlay');
      
      // Click event to redirect to home
      logoOverlay.addEventListener('click', function() {
        window.location.href = '/';
      });
      
      // Hover effects
      logoOverlay.addEventListener('mouseenter', function() {
        this.style.transform = 'scale(1.05)';
        this.style.boxShadow = '0 0 30px rgba(8, 8, 8, 1), 0 0 60px rgba(8, 8, 8, 0.6), 0 0 90px rgba(255, 255, 255, 0.1)';
        this.style.border = '1px solid rgba(255, 255, 255, 0.3)';
        document.getElementById('logo-image').style.filter = 'brightness(1.3)';
      });
      
      logoOverlay.addEventListener('mouseleave', function() {
        this.style.transform = 'scale(1)';
        this.style.boxShadow = '0 0 20px rgba(8, 8, 8, 0.8), 0 0 40px rgba(8, 8, 8, 0.4)';
        this.style.border = '1px solid rgba(255, 255, 255, 0.1)';
        document.getElementById('logo-image').style.filter = 'brightness(1.1)';
      });
    });
    
    // Wait for the iframe to load and ensure mobile interactions work
    document.querySelector('iframe').addEventListener('load', function() {
      // Ensure iframe is interactive after load
      this.focus();
      this.style.pointerEvents = 'auto';
      
      // Force a reflow to ensure the iframe is properly rendered
      this.style.display = 'none';
      this.offsetHeight; // Trigger reflow
      this.style.display = 'block';
      // Function to remove the Framer button
      function removeFramerButton() {
        try {
          const iframe = document.querySelector('iframe');
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
          
          // Look for the specific Framer button element
          const framerButton = iframeDoc.querySelector('div[data-framer-name="Text"].framer-g7oZR.framer-1um7t9d');
          
          if (framerButton) {
            framerButton.style.display = 'none';
            console.log('Framer button hidden successfully');
          } else {
            // If not found, try a more general approach
            const allFramerTexts = iframeDoc.querySelectorAll('div[data-framer-name="Text"]');
            allFramerTexts.forEach(element => {
              if (element.textContent && element.textContent.toLowerCase().includes('made in framer')) {
                element.style.display = 'none';
                console.log('Framer button hidden via text content');
              }
            });
          }
        } catch (error) {
          console.log('Cross-origin restrictions prevent direct access to iframe content');
        }
      }
      
      // Try to remove the button immediately
      removeFramerButton();
      
      // Also try after a short delay in case the content loads asynchronously
      setTimeout(removeFramerButton, 1000);
      setTimeout(removeFramerButton, 3000);
    });
  </script>
</body>
</html>
